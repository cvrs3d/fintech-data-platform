version: 2

models:
  - name: mart_account_daily
    description: "Daily account activity by UTC date and currency."
    columns:
      - name: activity_date
        data_tests:
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: entries_count
        data_tests:
          - not_null

  - name: fact_entries
    description: "One row per entry, linked to dimension versions at execution time."
    columns:
      - name: entry_id
        data_tests:
          - not_null
          - unique

      - name: transaction_id
        data_tests:
          - not_null

      - name: account_id
        data_tests:
          - not_null

      - name: amount
        data_tests:
          - not_null

      - name: executed_at_dt
        data_tests:
          - not_null

      - name: account_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_key

      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: currency_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_key


  - name: dim_customer
    description: "One row per observed version"

    columns:
      - name: source_customer_version_id
        description: "Version identifier from source.customer_history"
        data_tests:
          - not_null
          - unique
      - name: customer_key
        description: "Primary key, describes one row per one observed version"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Single customer identifier"
        data_tests:
          - not_null
      - name: valid_from
        description: "SCD2 type field"
        data_tests:
          - not_null
      - name: is_current
        description: "Flag that shows current version per customer"
        data_tests:
          - not_null
  
  - name: dim_account
    description: "One row per observed version of account"

    columns:
      - name: source_account_version_id
        description: "Account version identifier from source.account_history"
        data_tests:
          - not_null
          - unique

      - name: account_key
        description: "Primary key, version number"
        data_tests:
          - not_null
          - unique
      - name: account_id
        description: "Account id from raw"
        data_tests:
          - not_null
      - name: customer_id
        description: "Id of a customer, who owns this account"
        data_tests:
          - not_null

      - name: currency_id
        description: "Currency id which is used to define currency type"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_currency')
                field: currency_id
      - name: valid_from
        description: "Technical SCD2 column"
        data_tests:
          - not_null
      - name: is_current
        description: "Technical column, depends on valid_to"
        data_tests:
          - not_null

  - name: "dim_currency"
    columns: 
      - name: currency_key
        description: "raw.currency id"
        data_tests:
          - not_null
          - unique
      - name: currency_id
        description: "raw.currency.currency_id"
        data_tests:
          - not_null
          - unique
      - name: currency_code
        description: "ISO currency code"
        data_tests:
          - not_null
          - unique
      