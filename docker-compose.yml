services:
  postgres:
    image: postgres:17-bookworm
    container_name: postgres-dev
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

volumes:
  postgresql_data:
    driver: local